name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: generate-sitemap
        uses: cicirello/generate-sitemap@v1.10.4
        with:
          base-url-path: https://ideagent.eu/
          exclude-paths: >-
            /.github
            /.idea
            /googlef77404b084f15ab9.html
            /plugin.html
            /gateway_plugin_setup.html
            /security.html
          date-only: true
          include-pdf: false
          drop-html-extension: false
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4
